apiVersion: v1
kind: Service
metadata:
  name: {{ include "devops-ai-capstone.fullname" . }}
  labels:
    {{- include "devops-ai-capstone.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "devops-ai-capstone.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
