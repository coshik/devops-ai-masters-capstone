name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  ci:
    name: Test, Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate dependency vulnerability report
        run: npm audit --json > npm-audit-report.json
        continue-on-error: true

      - name: Fail if critical vulnerabilities are found
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit-report.json', 'utf8'));
          const critical = report.metadata?.vulnerabilities?.critical ?? 0;
          console.log(`Critical vulnerabilities found: ${critical}`);
          if (critical > 0) process.exit(1);
          NODE

      - name: Upload dependency scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          if-no-files-found: warn

      - name: Run unit tests
        run: npm test

      - name: Run code quality check
        run: npm run lint

      - name: Build application artifact
        run: npm run build

      - name: Verify build artifact
        run: ls -la dist/
