
name: CD - Multi-Stage Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 288761772142.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: devops-ai-masters-capstone
  EKS_CLUSTER_NAME: devops-ai-capstone
  IMAGE_URI: 288761772142.dkr.ecr.ap-south-1.amazonaws.com/devops-ai-masters-capstone:${{ github.sha }}

jobs:
  dev:
    name: Dev - Build and Test
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        
      - name: Show environment configuration
        run: |
          echo "Environment: ${{ vars.APP_ENV }}, log level: ${{ vars.LOG_LEVEL }}"
          echo "### Environment: ${{ vars.APP_ENV }} (log level ${{ vars.LOG_LEVEL }})" >> "$GITHUB_STEP_SUMMARY"
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run lint checks
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Build Docker image
        run: docker build -t "$IMAGE_URI" .

  test:
    name: Test - Validate Image and Application
    runs-on: ubuntu-latest
    needs: dev
    environment: testing

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Show environment configuration
        run: |
          echo "Environment: ${{ vars.APP_ENV }}, log level: ${{ vars.LOG_LEVEL }}"
          echo "### Environment: ${{ vars.APP_ENV }} (log level ${{ vars.LOG_LEVEL }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Validate Dockerfile
        run: docker build -t capstone-test:${{ github.sha }} .

      - name: Verify health endpoint implementation
        run: grep -n "/health" app/server.js

  prod:
    name: Prod - Deploy to Amazon EKS
    runs-on: ubuntu-latest
    needs: test
    environment: production

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Show environment configuration
        run: |
          echo "Environment: ${{ vars.APP_ENV }}, log level: ${{ vars.LOG_LEVEL }}"
          echo "### Environment: ${{ vars.APP_ENV }} (log level ${{ vars.LOG_LEVEL }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::288761772142:role/github-actions-devops-capstone-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build production Docker image
        run: docker build -t "$IMAGE_URI" .

      - name: Push commit-specific image
        run: docker push "$IMAGE_URI"

      - name: Tag and push latest image
        run: |
          docker tag "$IMAGE_URI" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Configure Kubernetes access
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Deploy application to EKS
        run: |
          sed "s|$ECR_REGISTRY/$ECR_REPOSITORY:latest|$IMAGE_URI|" \
            k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml

      - name: Verify deployment rollout
        run: |
          kubectl rollout status deployment/devops-ai-capstone \
            --timeout=180s
          kubectl get deployments
          kubectl get pods
          kubectl get services
