name: CD - Deploy to Amazon EKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 288761772142.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: devops-ai-masters-capstone
  EKS_CLUSTER_NAME: devops-ai-capstone
  IMAGE_URI: 288761772142.dkr.ecr.ap-south-1.amazonaws.com/devops-ai-masters-capstone:${{ github.sha }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Inspect non-secret OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("sts.amazonaws.com");
            const payload = token.split(".")[1];
            const claims = JSON.parse(
              Buffer.from(payload, "base64url").toString("utf8")
            );
            console.log(JSON.stringify({
              iss: claims.iss,
              aud: claims.aud,
              sub: claims.sub,
              repository: claims.repository,
              ref: claims.ref,
              event_name: claims.event_name
            }, null, 2));

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::288761772142:role/github-actions-devops-capstone-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t "$IMAGE_URI" .

      - name: Push commit-specific image
        run: |
          docker push "$IMAGE_URI"

      - name: Update latest image tag
        run: |
          docker tag "$IMAGE_URI" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

  deploy-to-eks:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::288761772142:role/github-actions-devops-capstone-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure Kubernetes access
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Deploy application to EKS
        run: |
          sed "s|$ECR_REGISTRY/$ECR_REPOSITORY:latest|$IMAGE_URI|" \
            k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml

      - name: Verify deployment rollout
        run: |
          kubectl rollout status deployment/devops-ai-capstone \
            --timeout=180s
          kubectl get deployments
          kubectl get pods
          kubectl get services
